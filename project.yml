name: WorkingOut
options:
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  developmentLanguage: en

configFiles:
  Debug: Config/App.xcconfig
  Release: Config/App.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic

packages:
  PadelKit:
    path: Packages/PadelKit
  WorkingOutKit:
    path: Packages/WorkingOutKit

targets:
  WorkingOut:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: iOS/PadelApp
      - path: iOS/Shared
    dependencies:
      - package: PadelKit
      - package: WorkingOutKit
      - target: WorkingOutWatch
        embed: true
      - target: WorkingOutWidgets
        embed: true
    entitlements:
      path: Generated/WorkingOut.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.icloud-container-identifiers:
          - "$(ICLOUD_CONTAINER_IDENTIFIER)"
    info:
      path: Generated/iOS-Info.plist
      properties:
        CFBundleDisplayName: "$(APP_DISPLAY_NAME)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleLocalizations: [en, da]
        WorkingOutWatchBundleIdentifier: "$(WATCH_APP_BUNDLE_IDENTIFIER)"
        NSLocationWhenInUseUsageDescription: "WorkingOut uses your location during a run to measure distance, pace, and route."
        # Required in the companion app because the embedded Watch app uses HealthKit.
        NSHealthShareUsageDescription: "WorkingOut reads workouts, heart rate, distance and energy to show training history and progress."
        NSHealthUpdateUsageDescription: "WorkingOut saves recorded strength and running workouts to Apple Health."
        UIBackgroundModes: [location]
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arm64]
        NSHumanReadableCopyright: "© 2026 WorkingOut"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(APP_BUNDLE_IDENTIFIER)"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  WorkingOutWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: WatchApp/PadelWatch
    dependencies:
      - package: WorkingOutKit
      - target: WorkingOutWatchWidgets
        embed: true
    entitlements:
      path: Generated/WorkingOutWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
    info:
      path: Generated/watchOS-Info.plist
      properties:
        CFBundleDisplayName: "$(APP_DISPLAY_NAME)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleLocalizations: [en, da]
        WKApplication: true
        WKCompanionAppBundleIdentifier: "$(APP_BUNDLE_IDENTIFIER)"
        WKRunsIndependentlyOfCompanionApp: true
        WKBackgroundModes: [workout-processing]
        NSHealthShareUsageDescription: "WorkingOut reads workouts, heart rate, distance and energy to show training history and progress."
        NSHealthUpdateUsageDescription: "WorkingOut saves recorded strength and running workouts to Apple Health."
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSHumanReadableCopyright: "© 2026 WorkingOut"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(WATCH_APP_BUNDLE_IDENTIFIER)"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  WorkingOutWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: iOS/PadelWidgets
      - path: iOS/Shared
    info:
      path: Generated/WorkingOutWidgets-Info.plist
      properties:
        CFBundleDisplayName: "$(APP_DISPLAY_NAME) Widgets"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleLocalizations: [en, da]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(WIDGET_BUNDLE_IDENTIFIER)"
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES

  WorkingOutWatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: WatchApp/PadelWatchWidgets
    info:
      path: Generated/WorkingOutWatchWidgets-Info.plist
      properties:
        CFBundleDisplayName: "$(APP_DISPLAY_NAME)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleLocalizations: [en, da]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(WATCH_WIDGET_BUNDLE_IDENTIFIER)"
        SKIP_INSTALL: YES

  WorkingOutUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: UITests/WorkingOut
    dependencies:
      - target: WorkingOut
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(APP_BUNDLE_IDENTIFIER).uitests"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: WorkingOut

schemes:
  WorkingOut:
    build:
      targets:
        WorkingOut: all
        WorkingOutWatch: all
    test:
      config: Debug
      targets:
        - WorkingOutUITests
    run:
      config: Debug
    archive:
      config: Release
  WorkingOutWatch:
    build:
      targets:
        WorkingOutWatch: all
    run:
      config: Debug
    archive:
      config: Release
