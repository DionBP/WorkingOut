name: CI

# Feature-branch safety net: the TestFlight workflow only runs on main, so
# without this nothing compiles or tests changes before they land there.
on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-shared-core:
    name: Test WorkingOut and shared core
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27"

      - name: Verify iOS 27 SDK
        shell: bash
        run: |
          xcodebuild -version
          sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iOS SDK: $sdk_version"
          [[ "$sdk_version" == 27.* ]] || { echo "Expected iOS 27 SDK, got $sdk_version" >&2; exit 1; }

      - name: Run shared core unit tests (legacy)
        working-directory: Packages/PadelKit
        run: swift test

      - name: Check English and Danish String Catalogs
        run: python3 scripts/check_workingout_localization.py

      - name: Run WorkingOutKit unit tests
        working-directory: Packages/WorkingOutKit
        run: swift test

  build-apps:
    name: Build iOS + Watch apps (simulator)
    needs: test-shared-core
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27"

      - name: Verify iOS 27 SDK
        shell: bash
        run: |
          xcodebuild -version
          sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iOS SDK: $sdk_version"
          [[ "$sdk_version" == 27.* ]] || { echo "Expected iOS 27 SDK, got $sdk_version" >&2; exit 1; }

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate app icons
        run: python3 scripts/generate_app_icons.py

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build WorkingOut iOS and Watch apps (no signing)
        run: |
          xcodebuild build \
            -project Padel.xcodeproj \
            -scheme PadelApp \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Run WorkingOut UI smoke test
        shell: bash
        run: |
          simulator_id="$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          runtimes = json.load(sys.stdin)["devices"]
          ios27 = [devices for runtime, devices in runtimes.items() if ".iOS-27-" in runtime]
          print(next((device["udid"] for devices in ios27 for device in devices if device["name"].startswith("iPhone")), ""))
          ')"
          if [[ -z "$simulator_id" ]]; then
            echo "::notice::No iOS 27 iPhone simulator device is available for the UI smoke test."
            exit 0
          fi
          xcodebuild test \
            -project Padel.xcodeproj \
            -scheme PadelApp \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY=""
