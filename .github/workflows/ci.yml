name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-shared-core:
    name: Test WorkingOut and shared core
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27"

      - name: Verify iOS 27 SDK
        shell: bash
        run: |
          xcodebuild -version
          sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iOS SDK: $sdk_version"
          [[ "$sdk_version" == 27.* ]] || { echo "Expected iOS 27 SDK, got $sdk_version" >&2; exit 1; }

      - name: Run shared core unit tests (legacy)
        working-directory: Packages/PadelKit
        run: swift test

      - name: Check English and Danish String Catalogs
        run: |
          python3 scripts/check_workingout_localization.py
          python3 scripts/import_exercises.py --check

      - name: Run WorkingOutKit unit tests
        working-directory: Packages/WorkingOutKit
        run: swift test

  build-apps:
    name: Build iOS + Watch apps (simulator)
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27"

      - name: Verify iOS 27 SDK
        shell: bash
        run: |
          xcodebuild -version
          sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iOS SDK: $sdk_version"
          [[ "$sdk_version" == 27.* ]] || { echo "Expected iOS 27 SDK, got $sdk_version" >&2; exit 1; }

      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null || HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen

      - name: Generate app icons
        run: python3 scripts/generate_app_icons.py

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Select iOS 27 simulator
        id: simulator
        shell: bash
        run: |
          simulator_id="$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          runtimes = json.load(sys.stdin)["devices"]
          ios27 = [devices for runtime, devices in runtimes.items() if ".iOS-27-" in runtime]
          print(next((device["udid"] for devices in ios27 for device in devices if device["name"].startswith("iPhone")), ""))
          ')"
          if [[ -z "$simulator_id" ]]; then
            echo "::notice::No iOS 27 iPhone simulator device is available for the UI smoke test."
            echo "destination=generic/platform=iOS Simulator" >> "$GITHUB_OUTPUT"
          else
            echo "destination=platform=iOS Simulator,id=$simulator_id" >> "$GITHUB_OUTPUT"
            echo "id=$simulator_id" >> "$GITHUB_OUTPUT"
          fi

      - name: Build WorkingOut, Watch and UI tests (no signing)
        env:
          SIMULATOR_DESTINATION: ${{ steps.simulator.outputs.destination }}
        run: |
          xcodebuild build-for-testing \
            -project Padel.xcodeproj \
            -scheme PadelApp \
            -destination "$SIMULATOR_DESTINATION" \
            -derivedDataPath "$RUNNER_TEMP/WorkingOutBuild" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Run WorkingOut UI smoke test
        if: steps.simulator.outputs.id != ''
        env:
          SIMULATOR_DESTINATION: ${{ steps.simulator.outputs.destination }}
        timeout-minutes: 20
        run: |
          xcodebuild test-without-building \
            -resultBundlePath "$RUNNER_TEMP/WorkingOutUI.xcresult" \
            -project Padel.xcodeproj \
            -scheme PadelApp \
            -destination "$SIMULATOR_DESTINATION" \
            -derivedDataPath "$RUNNER_TEMP/WorkingOutBuild" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Export simulator screenshots
        if: always() && steps.simulator.outputs.id != ''
        run: |
          result="$RUNNER_TEMP/WorkingOutUI.xcresult"
          if [[ -d "$result" ]]; then
            mkdir -p "$RUNNER_TEMP/WorkingOutScreenshots"
            xcrun xcresulttool export attachments --path "$result" --output-path "$RUNNER_TEMP/WorkingOutScreenshots"
          fi

      - name: Upload simulator screenshots
        if: always() && steps.simulator.outputs.id != ''
        uses: actions/upload-artifact@v4
        with:
          name: workingout-simulator-screenshots
          path: ${{ runner.temp }}/WorkingOutScreenshots
          if-no-files-found: ignore
